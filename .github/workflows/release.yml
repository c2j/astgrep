name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-main:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::Tag ${{ github.ref_name }} is not on main branch. Release workflow aborted."
            exit 1
          }

  build-linux-x86_64:
    name: Linux x86_64 (glibc ≥ 2.22)
    needs: verify-main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-zigbuild
        run: pip install cargo-zigbuild

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-x86_64-zig

      # zigbuild --target x86_64-unknown-linux-gnu.2.22 links against glibc 2.22
      # Compatible with: Debian 8+, Ubuntu 16.04+, CentOS 7+, UOS/Deepin
      - name: Build
        run: |
          cargo zigbuild --release \
            --target x86_64-unknown-linux-gnu.2.22 \
            --workspace --exclude astgrep-web --exclude astgrep-gui --exclude test-utils

      - name: Strip binary
        run: strip target/x86_64-unknown-linux-gnu/release/astgrep

      - name: Package
        run: >
          tar -czf astgrep-x86_64-unknown-linux-gnu.tar.gz
          -C target/x86_64-unknown-linux-gnu/release
          astgrep

      - uses: actions/upload-artifact@v4
        with:
          name: astgrep-x86_64-unknown-linux-gnu
          path: astgrep-x86_64-unknown-linux-gnu.tar.gz

  build-linux-aarch64:
    name: Linux aarch64 (glibc ≥ 2.22)
    needs: verify-main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install cargo-zigbuild
        run: pip install cargo-zigbuild

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-aarch64-zig

      - name: Build
        run: |
          cargo zigbuild --release \
            --target aarch64-unknown-linux-gnu.2.22 \
            --workspace --exclude astgrep-web --exclude astgrep-gui --exclude test-utils

      - name: Install aarch64 strip tool
        run: sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu

      - name: Strip binary
        run: aarch64-linux-gnu-strip target/aarch64-unknown-linux-gnu/release/astgrep

      - name: Package
        run: >
          tar -czf astgrep-aarch64-unknown-linux-gnu.tar.gz
          -C target/aarch64-unknown-linux-gnu/release
          astgrep

      - uses: actions/upload-artifact@v4
        with:
          name: astgrep-aarch64-unknown-linux-gnu
          path: astgrep-aarch64-unknown-linux-gnu.tar.gz

  build-windows-x86_64:
    name: Windows x86_64 (Win7+)
    needs: verify-main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x86_64-gnu

      # -C link-arg=-static produces a fully self-contained .exe with no DLL dependencies.
      # The x86_64-pc-windows-gnu target uses MinGW-w64 CRT which is compatible with Windows 7+.
      - name: Build
        run: |
          cargo build --release \
            --target x86_64-pc-windows-gnu \
            --workspace --exclude astgrep-web --exclude astgrep-gui --exclude test-utils
        env:
          RUSTFLAGS: '-C link-arg=-static'

      - name: Strip binary
        run: x86_64-w64-mingw32-strip target/x86_64-pc-windows-gnu/release/astgrep.exe

      - name: Package
        run: >
          zip astgrep-x86_64-pc-windows-gnu.zip
          -j target/x86_64-pc-windows-gnu/release/astgrep.exe

      - uses: actions/upload-artifact@v4
        with:
          name: astgrep-x86_64-pc-windows-gnu
          path: astgrep-x86_64-pc-windows-gnu.zip

  release:
    name: Create GitHub Release
    needs:
      - build-linux-x86_64
      - build-linux-aarch64
      - build-windows-x86_64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          find . -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec sha256sum {} \; \
            | sed 's|  ./|  |' > ../checksums-sha256.txt
          mv ../checksums-sha256.txt .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/astgrep-x86_64-unknown-linux-gnu/astgrep-x86_64-unknown-linux-gnu.tar.gz
            artifacts/astgrep-aarch64-unknown-linux-gnu/astgrep-aarch64-unknown-linux-gnu.tar.gz
            artifacts/astgrep-x86_64-pc-windows-gnu/astgrep-x86_64-pc-windows-gnu.zip
            artifacts/checksums-sha256.txt
