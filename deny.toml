# cargo-deny configuration (v2)

[advisories]
version = 2
ignore = [
    # RUSTSEC-2025-0119: number_prefix is unmaintained
    # Transitive dependency via indicatif → astgrep-cli
    # No safe upgrade available; low-risk crate for numeric prefix formatting
    "RUSTSEC-2025-0119",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/c2j/ogsql-parser",
]
