# cargo-deny configuration (v2)

[advisories]
version = 2
ignore = [
    "RUSTSEC-2025-0119", # number_prefix is unmaintained (pre-existing, indirect)
    "RUSTSEC-2026-0189", # rmcp: DNS rebinding in Streamable HTTP (we use stdio only)
    "RUSTSEC-2024-0436", # paste is unmaintained (rmcp dep, pre-existing)
    "RUSTSEC-2026-0204", # crossbeam-epoch: invalid pointer deref (pre-existing, indirect)
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/c2j/ogsql-parser",
]
