[package]
name = "astgrep-parser"
version = "0.4.8"
edition = "2021"
license = "MIT"
description = "Language parsers and adapters for astgrep"

[dependencies]
astgrep-core = { path = "../astgrep-core" }
astgrep-ast = { path = "../astgrep-ast" }
anyhow.workspace = true
thiserror.workspace = true
tree-sitter.workspace = true
tree-sitter-python.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-java.workspace = true
tree-sitter-bash.workspace = true
# tree-sitter-sql.workspace = true
regex = "1.0"
tree-sitter-sequel = { version = "0.3.11", optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
glob.workspace = true
walkdir.workspace = true
sha2.workspace = true
tracing.workspace = true
# ogsql-parser - hand-written recursive descent SQL parser for openGauss/GaussDB
# License: MIT OR Apache-2.0 (compatible with astgrep MIT)
# Maturity: 537 commits, 1646 unit tests, 1409 openGauss regression tests
# M-DEP-01: pinned to tag for reproducible builds
# v0.8.0: ObjectName is now Vec<Ident> (was Vec<String>); Ident carries quote_style
# v0.8.4: latest patch on the 0.8 line (Vec<Ident> API unchanged)
ogsql-parser = { git = "https://github.com/c2j/ogsql-parser", tag = "v0.8.31" }
# sqlparser-rs (Apache DataFusion) for PolarDB-MySQL dialect (Phase 4)
# License: Apache-2.0
sqlparser = "0.62"

[dev-dependencies]
tempfile = "3.8"
proptest.workspace = true

[features]
default = ["sql-tree-sitter"]
sql-tree-sitter = ["dep:tree-sitter-sequel"]
php = []
