rules:
  - id: GAUSSDB-SEC-001
    name: "SELECT * 使用检测"
    description: "SELECT * 可能导致不必要的网络传输和列暴露，建议显式列出所需列"
    languages: [sql]
    dialects: [gaussdb, opengauss, standard]
    patterns:
      - pattern: "SELECT *"
    message: "建议避免使用 SELECT *，显式列出所需列名"
    severity: WARNING
    confidence: MEDIUM
    metadata:
      category: security
      cwe: "CWE-200"

  - id: GAUSSDB-HINT-001
    name: "Plan Hint 使用检测"
    description: "检测 /*+ ... */ 优化器 hint 使用，便于性能审计"
    languages: [sql]
    dialects: [gaussdb, opengauss]
    patterns:
      - pattern: "/*+"
    message: "检测到 Plan Hint 使用，请验证 hint 关键字是否被 GaussDB 支持"
    severity: INFO
    confidence: HIGH
    metadata:
      category: performance

  - id: GAUSSDB-SEC-002
    name: "UPDATE 缺少 WHERE 子句"
    description: "不带 WHERE 的 UPDATE 会更新全表数据，可能导致数据丢失"
    languages: [sql]
    dialects: [gaussdb, opengauss, standard]
    patterns:
      - pattern: "UPDATE $T SET $S"
      - pattern-not: "UPDATE $T SET $S WHERE $W"
    message: "UPDATE 语句缺少 WHERE 子句，将更新全表数据"
    severity: WARNING
    confidence: HIGH
    metadata:
      category: security
      cwe: "CWE-1106"

  - id: GAUSSDB-SEC-003
    name: "DELETE 缺少 WHERE 子句"
    description: "不带 WHERE 的 DELETE 会清空全表数据，极其危险"
    languages: [sql]
    dialects: [gaussdb, opengauss, standard]
    patterns:
      - pattern: "DELETE FROM $T"
      - pattern-not: "DELETE FROM $T WHERE $W"
    message: "DELETE 语句缺少 WHERE 子句，将删除全表数据"
    severity: ERROR
    confidence: HIGH
    metadata:
      category: security
      cwe: "CWE-1106"
